<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UniMart | Feira de trocas</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand">♻️ UniMart</div><p>Feira de trocas e doações da comunidade Senac</p><button id="novoBtn">+ Publicar anúncio</button></header>
<main><section class="intro"><div><span class="tag">COMUNIDADE SENAC</span><h1>Dê uma nova vida<br>ao que você não usa.</h1><p>Encontre materiais, compartilhe conhecimento e faça a diferença.</p></div></section>
<section class="tools"><input id="busca" placeholder="Buscar livros, materiais, equipamentos..."><select id="categoria"><option value="">Todas as categorias</option><option>Livros</option><option>Materiais escolares</option><option>Eletrônicos</option><option>Equipamentos</option><option>Outros</option></select><select id="modalidade"><option value="">Trocas e doações</option><option value="TROCA">Troca</option><option value="DOACAO">Doação</option></select></section>
<section><div class="section-title"><h2>Anúncios disponíveis</h2><span id="contador"></span></div><div id="lista" class="grid"></div></section>
</main>
<dialog id="formDialog"><form id="anuncioForm"><div class="dialog-head"><h2>Novo anúncio</h2><button type="button" class="close" id="fechar">×</button></div><label>Seu nome<input name="nome" required></label><label>Turma (opcional)<input name="turma"></label><label>Título do item<input name="titulo" required></label><label>Descrição<textarea name="descricao" required rows="3"></textarea></label><div class="two"><label>Categoria<select name="categoria" required><option value="">Selecione</option><option>Livros</option><option>Materiais escolares</option><option>Eletrônicos</option><option>Equipamentos</option><option>Outros</option></select></label><label>Modalidade<select name="modalidade"><option value="TROCA">Troca</option><option value="DOACAO">Doação</option></select></label></div><label>Link da foto (opcional)<input name="foto" type="url" placeholder="https://..."></label><button class="primary" type="submit">Publicar anúncio</button></form></dialog>
<dialog id="interesseDialog"><form id="interesseForm"><div class="dialog-head"><h2>Tenho interesse</h2><button type="button" class="close" id="fecharInteresse">×</button></div><input type="hidden" name="anuncio_id"><label>Seu nome<input name="nome" required></label><label>Mensagem<textarea name="mensagem" required rows="3" placeholder="Conte como gostaria de combinar..."></textarea></label><button class="primary">Enviar interesse</button></form></dialog>
<script src="app.js"></script></body></html>
